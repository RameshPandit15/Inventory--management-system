                  <img src="../assets/Icons/package.png" alt="products-icon">
                </div>

            <a href="categories.html" class="nav-link">

    <div class="main-content">
        <header class="header">
            <div class="page-title">
                <h2>Products</h2>
                <span>Manage all your products and inventory</span>
            </div>
            <div class="header-actions">
                <form class="search-form">
                    <input type="search" placeholder="Search products, categories">
                    <button type="submit">
                        <img src="..\assets\Icons\search.png" alt="search-logo">
                    </button>
                    
                </form>
                <button type="submit">
                    <img src="..\assets\Icons\notifications.png" alt="notification-icon">
                    
                </button>
                <button type="submit" id="mode">
                    <img src="..\assets\Icons\day-mode.png" alt="theme-icon">

                </button>
                <button type="submit">
                    <img src="..\assets\Icons\profile.png" alt="profile-icon">

                </button>

            </div>
        </header>

        <main class="main">
            <section class="search-section">
                <div class="search-bar">
                    <input type="text" id="search" placeholder="Search product by name..."/>
                    <button typ="submit" id="searchProduct">
                        <img src="..\assets\Icons\search.png" alt="icon">
                    </button>
                </div>
                <div class="section-button">
                    <label for="category-select">All Categories:</label>
                    <select id="category-select" name="category">
                        <option value="all">All</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Kitchen">Kitchen</option>
                        <option value="Home">Home</option>
                        <option value="Clothings">Clothes</option>
                        <option value="Accessories">Accessories</option>
                        
                    </select>
                </div>
                <div class="section-button">
                    <label for="status-section">All Status:</label>
                    <select id="status-section" name="status">
                         <option value="all">All</option>
                        <option value="low-stock">Low-Stock</option>
                        <option value="In-Stock">In-Stock</option>
                        <option value="Out-Stock">Out-Stock</option>
                    </select>
                </div>
                <div class="section-button">
                    <label for="sort-product">Sort by:</label>
                    <select id="sort-product" name="sort">
                         <option value="all">All</option>
                        <option value="Latest">Latest</option>
                        <option value="Oldest">Oldest</option>
                    </select>
                </div>
                <div class="product-button">
                    <button type="submit" id="form" class="click-button">+ Add Product</button>

                    <dialog id="newForm" class="form-data">
                        <form method="dialog">
                            <h3>Add New Product</h3>
                            <div class="form-group">
                                <label for="text">Product Name:</label>
                                <input type="text" id="text" class="new-Product" placeholder="Enter Product Name" required />
                            </div>
                            <div class="form-group">
                                <label for="category">Category:</label>
                                <input type="text" id="category" class="new-Product" placeholder="Enter Category" required />
                            </div>
                            <div class="form-group">
                                <label for="price">Price(NPR):</label>
                                <input type="text" id="price" class="new-Product" placeholder="Enter Price" required />
                            </div>
                            <div class="form-group">
                                <label for="stock">Stock Quantity:</label>
                                <input type="text" id="stock" class="new-Product" placeholder="Enter stock quantity" required />
                            </div>
                            <div class="form-group">
                                <label for="supplier">Supplier:</label>
                                <input type="text" id="supplier" class="new-product" placeholder="Enter supplier name" required />
                            </div>
                            <div class="form-select">
                                <label for="upload">Product Image:</label>
                                <input type="file" id="upload" name="upload" accept="image/png, image/jpg"/>
                            </div>
                            <div class="form-select">
                                <label for="status">Status</label>
                                <select name="stocks" id="status">
                                    <option value="In Stock">In Stock</option>
                                </select>
                            </div>

                            <div class="save-button">
                                <button type="submit" id="cancel">Cancel</button>
                                <button type="submit" id="saveProduct">Save Product</button>
                            </div>
                        </form>
                    </dialog>
                </div>
                
            </section>

            <section class="products-section">
                <div class="section-header">
                    <h3>Products</h3>
                    <button type="submit">View All</button>
                </div>

                <div class="table-container">

                    <table class="product-table">

                        <thead>
                            <tr>
                                <th>Products</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="productTableBody">
                         

                        </tbody>
                    </table>
                </div>

            </section>
        </main>

        <footer class="footer">
        <p> &copy; 2026 Stock Master. All rights reserved</p>
        </footer>
    </div>
   

    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/events.js"></script>
    <script src="../assets/js/product.js"></script>
    <script src="../assets/js/search.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="..\assets\js\utils.js"></script>
    <script src="..\assets\js\validation.js"></script>
    <script src="..\assets\js\sort.js"></script>
    <script src="..\assets\js\filter.js"></script>
    <script src="..\assets\js\statistics.js"></script>
    <script src="..\assets\js\productPage.js"></script>
</body>
</html>
